# QuickFind Upptime 状态站配置
# 文档：https://upptime.js.org/docs/configuration
owner: newmanchuria-core
repo: qf-status

# 首屏介绍（支持 Markdown）
introTitle: "**QuickFind** 服务运行状态"
introMessage: "本页面实时展示 QuickFind 官网、Releases 分发站、自动更新源与云端服务的可用性，数据每 5 分钟自动刷新。"

status-website:
  cname: status.quickfindapp.com
  name: QuickFind 系统状态
  url: https://status.quickfindapp.com
  # 不固定主题，自动跟随系统明暗模式
  logoUrl: https://raw.githubusercontent.com/newmanchuria-core/qf-status/master/assets/logo.svg
  logoHref: https://status.quickfindapp.com
  faviconSvg: https://raw.githubusercontent.com/newmanchuria-core/qf-status/master/assets/favicon.svg
  metaTags:
    - name: description
      content: QuickFind 官网、Releases 分发站与云端服务的实时运行状态
    - name: theme-color
      content: "#2563eb"
  navbar:
    - title: 官网
      href: https://www.quickfindapp.com
    - title: 下载
      href: https://www.quickfindapp.com/download.html
    - title: FAQ
      href: https://www.quickfindapp.com/faq.html
    - title: Releases
      href: https://releases.quickfindapp.com
    - title: 管理后台
      href: https://admin.quickfindapp.com
    - title: GitHub
      href: https://github.com/newmanchuria-core/quickfind
      target: _blank
  # 品牌色覆盖（QuickFind 蓝 #2563eb / 青 #06b6d4）
  css: |
    :root {
      --body-background-color: #f6f8fc;
      --body-text-color: #0f172a;
      --card-background-color: #ffffff;
      --nav-background-color: #ffffff;
      --nav-border-bottom-color: #e2e8f0;
      --nav-current-border-bottom-color: #2563eb;
      --card-border-color: #e2e8f0;
      --up-border-left-color: #16a34a;
      --tag-up-background-color: #16a34a;
      --down-border-left-color: #dc2626;
      --down-background-color: #fee2e2;
      --tag-down-background-color: #dc2626;
      --degraded-border-left-color: #d97706;
      --tag-degraded-background-color: #d97706;
      --change-background-color: #d97706;
      --error-button-border-color: #1d4ed8;
      --error-button-background-color: #2563eb;
      --submit-button-border-color: #1d4ed8;
      --submit-button-background-color: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --body-background-color: #0b1220;
        --body-text-color: #e2e8f0;
        --card-background-color: #111a2e;
        --nav-background-color: #111a2e;
        --nav-border-bottom-color: #1e293b;
        --nav-current-border-bottom-color: #3b82f6;
        --card-border-color: #1e293b;
        --down-background-color: #3f1418;
        --tag-color: #e2e8f0;
      }
    }
    article { border-radius: 12px; transition: box-shadow .18s ease; }
    article:hover { box-shadow: 0 8px 24px rgba(37,99,235,.10); }
    nav {
      font-weight: 400;
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,.82);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    nav .logo img { border-radius: 8px; height: 2.4rem; }
    nav ul a { transition: color .15s ease; }
    nav ul a:hover { color: #2563eb; }
    [aria-current] { border-bottom: 2px solid #2563eb; }
    .container { max-width: 860px; }
    .tag { border-radius: 999px; }
    .graph, img.graph { border-radius: 10px; }
    footer { font-size: 13px; opacity: .85; }
    @media (prefers-color-scheme: dark) {
      nav { background: rgba(17,26,46,.82); }
      article:hover { box-shadow: 0 8px 24px rgba(0,0,0,.35); }
      nav ul a:hover { color: #60a5fa; }
    }
    @media (max-width: 720px) {
      .container { padding: 0 1.1rem; flex-wrap: wrap !important; justify-content: center !important; }
      nav { overflow-x: visible !important; white-space: normal !important; margin-bottom: 1.25rem !important; }
      nav .logo { float: none !important; margin: 0.5rem 0.5rem 0 !important; }
      nav ul { flex-wrap: wrap !important; }
      nav ul a { padding: 0.7rem 0.85rem !important; font-size: 14px !important; }
      nav .logo img { height: 2rem !important; }
    }

