# QuickFind Upptime 状态站配置（美化版）
# 文档：https://upptime.js.org/docs/configuration
owner: newmanchuria-core
repo: qf-status

status-website:
  name: QuickFind 系统状态
  url: https://status.quickfindapp.com
  baseUrl: https://newmanchuria-core.github.io/qf-status
  theme: auto            # 跟随系统明暗，与官网一致
  locale: zh-CN
  logo: https://www.quickfindapp.com/favicon.svg
  showUpptimeLogo: false
  useEmoji: true
  introTitle: QuickFind 系统状态
  introDescription: 实时监测 QuickFind 官网、管理后台、Releases 分发站与后端依赖的可用性与响应时间。全部指标每 5 分钟自动探测。
  navbar:
    - title: 官网
      href: https://www.quickfindapp.com
    - title: Releases
      href: https://releases.quickfindapp.com
    - title: 管理后台
      href: https://admin.quickfindapp.com
    - title: 隐私政策
      href: https://www.quickfindapp.com/privacy.html
    - title: 服务条款
      href: https://www.quickfindapp.com/terms.html
    - title: GitHub
      href: https://github.com/newmanchuria-core/quickfind
  footer:
    - title: 官网
      href: https://www.quickfindapp.com
    - title: Releases
      href: https://releases.quickfindapp.com
    - title: 管理后台
      href: https://admin.quickfindapp.com
    - title: 隐私政策
      href: https://www.quickfindapp.com/privacy.html
    - title: 服务条款
      href: https://www.quickfindapp.com/terms.html
    - title: GitHub
      href: https://github.com/newmanchuria-core/quickfind

# 监控项（名称前缀即分组：官网 / 后台 / 分发 / 后端依赖 / 代码托管）
sites:
  # —— 官网 ——
  - name: 官网 · 首页
    url: https://www.quickfindapp.com/
    expectedStatusCodes: [200, 301, 302]
  # —— 后台 ——
  - name: 后台 · 管理控制台
    url: https://admin.quickfindapp.com/
    expectedStatusCodes: [200, 301, 302, 401]
  # —— 分发 ——
  - name: 分发 · Releases 首页
    url: https://releases.quickfindapp.com/
    expectedStatusCodes: [200, 301, 302]
  - name: 分发 · 更新源 latest.yml
    url: https://releases.quickfindapp.com/releases/latest.yml
    expectedStatusCodes: [200]
  - name: 分发 · R2 资产端点
    url: https://releases.quickfindapp.com/QuickFind-Setup-1.0.0-x64.exe
    expectedStatusCodes: [200, 206, 301, 302, 403]
  # —— 后端依赖 ——
  - name: 后端 · Supabase A REST
    url: https://mgbuwpnbfdogdunluyqa.supabase.co/rest/v1/
    expectedStatusCodes: [200, 401, 404]
  - name: 后端 · Supabase B Auth
    url: https://kcbkotryhafxcbvyceft.supabase.co/auth/v1/health
    expectedStatusCodes: [200, 401]
  # —— 代码托管 ——
  - name: 代码 · GitHub Releases
    url: https://github.com/newmanchuria-core/quickfind/releases/latest
    expectedStatusCodes: [200, 301, 302]

# 第三方依赖状态页（仅在 navbar/footer 以链接展示，不主动探测）：
#   Resend     https://status.resend.com
#   Cloudflare https://www.cloudflarestatus.com
#   Supabase   https://status.supabase.com
#   GitHub     https://www.githubstatus.com

# 不监控敏感写接口（/api/feedback、Resend send-email），避免触发真实邮件或写库。

branch: main
commitChange: true
commitAuthorName: quickfind-status-bot
commitAuthorEmail: status@quickfindapp.com
workflowSchedule:
  graphs: "0 0 * * *"
  summaries: "0 0 * * *"
  responseTime: "*/5 * * * *"
  status: "*/5 * * * *"
  incidents: "0 * * * *"
  maint: "0 0 * * *"
